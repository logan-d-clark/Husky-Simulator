<svg xmlns="http://www.w3.org/2000/svg" width="128" height="100" viewBox="0 0 128 100">
  <!-- ground shadow -->
  <ellipse cx="60" cy="90" rx="48" ry="6.5" fill="#00000022"/>

  <!-- fluffy curled tail (husky signature), back-left -->
  <path d="M30 60 q-20 -2 -22 -22 q-1 -14 13 -15 q-7 7 -3 17 q4 11 15 13 z" fill="#5a5a66"/>
  <path d="M22 22 q6 -7 13 -4 q-4 7 -12 9 z" fill="#e8e8ee"/>

  <!-- back legs + paws -->
  <rect x="32" y="60" width="10" height="27" rx="5" fill="#3f3f4a"/>
  <rect x="60" y="60" width="10" height="27" rx="5" fill="#3f3f4a"/>
  <rect x="31" y="81" width="13" height="8" rx="4" fill="#e8e8ee"/>
  <rect x="59" y="81" width="13" height="8" rx="4" fill="#e8e8ee"/>

  <!-- body -->
  <ellipse cx="56" cy="57" rx="36" ry="21" fill="#5a5a66"/>
  <!-- white chest/belly -->
  <ellipse cx="72" cy="64" rx="19" ry="12" fill="#e8e8ee"/>

  <!-- front legs + paws -->
  <rect x="43" y="62" width="10" height="25" rx="5" fill="#3f3f4a"/>
  <rect x="73" y="62" width="10" height="25" rx="5" fill="#3f3f4a"/>
  <rect x="42" y="81" width="13" height="8" rx="4" fill="#e8e8ee"/>
  <rect x="72" y="81" width="13" height="8" rx="4" fill="#e8e8ee"/>

  <!-- head -->
  <circle cx="92" cy="44" r="21" fill="#5a5a66"/>

  <!-- erect triangular ears -->
  <polygon points="79,29 74,4 93,22" fill="#5a5a66"/>
  <polygon points="81,26 79,12 90,22" fill="#3f3f4a"/>
  <polygon points="103,29 110,4 91,22" fill="#5a5a66"/>
  <polygon points="101,26 105,12 93,22" fill="#3f3f4a"/>

  <!-- white face mask + muzzle -->
  <path d="M92 32 q-9 5 -9 16 q0 8 4 12 l14 0 q4 -4 4 -12 q0 -11 -9 -16z" fill="#e8e8ee"/>
  <ellipse cx="107" cy="54" rx="16" ry="10" fill="#e8e8ee"/>

  <!-- blue eyes -->
  <circle cx="97" cy="42" r="4.4" fill="#6fb3d6"/>
  <circle cx="97.5" cy="42.3" r="2.1" fill="#13232e"/>
  <circle cx="96" cy="40.8" r="1.1" fill="#ffffff"/>

  <!-- nose + happy tongue -->
  <ellipse cx="120" cy="52" rx="4.8" ry="3.8" fill="#1a1a1a"/>
  <path d="M113 59 q5 8 -2 10 q-5 0 -4 -6 z" fill="#e8899a"/>
</svg>
